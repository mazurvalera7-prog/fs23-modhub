<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FS23 ModHub: адмінка</title>
<style>
  :root { --bg:#12161b; --card:#1b222a; --line:#2a343f; --text:#e8edf2; --mute:#8d9aa8; --acc:#6cc04a; --accd:#10200a; --bad:#e5604d; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:20px 16px 60px; }
  h1 { margin:0 0 2px; font-size:24px; } h2 { font-size:18px; margin:26px 0 10px; }
  a { color:var(--acc); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  label { display:block; font-size:14px; color:var(--mute); margin:12px 0 4px; }
  input, select, textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:inherit; min-width:0; }
  input[type=checkbox] { width:auto; margin-right:8px; }
  input[type=file] { padding:9px; }
  textarea { min-height:90px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media (max-width:600px){ .row { grid-template-columns:1fr; } }
  button { background:var(--acc); color:var(--accd); border:0; border-radius:10px; padding:12px 18px; font:inherit; font-weight:650; cursor:pointer; margin-top:16px; }
  button:disabled { opacity:.5; cursor:wait; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button.del { background:transparent; color:var(--bad); border:1px solid var(--bad); padding:6px 12px; margin:0; font-weight:500; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .item:first-child { border-top:0; }
  .m { color:var(--mute); font-size:14px; overflow-wrap:anywhere; }
  .hint { color:var(--mute); font-size:13px; margin-top:4px; }
  progress { width:100%; height:10px; margin-top:14px; display:none; }
  #log { margin-top:12px; font-size:14px; white-space:pre-line; }
  .ok { color:var(--acc); } .err { color:var(--bad); }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .hidden { display:none !important; }
  code { background:var(--bg); padding:2px 6px; border-radius:6px; overflow-wrap:anywhere; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Адмінка FS23 ModHub</h1>
      <div class="m"><a href="index.html">на сайт</a> · для гри: <code id="cat-url"></code></div>
    </div>
    <button class="ghost hidden" id="logout" style="margin:0">Вийти</button>
  </div>

  <!-- вхід -->
  <div class="panel" id="login" style="margin-top:18px">
    <label for="tok">GitHub-токен (Fine-grained, доступ тільки до цього репозиторію, Contents: Read and write)</label>
    <input id="tok" type="password" autocomplete="off" placeholder="github_pat_…">
    <label style="display:flex;align-items:center;margin-top:12px"><input type="checkbox" id="remember"> Запам'ятати на цьому пристрої</label>
    <div class="hint">Токен зберігається тільки в цьому браузері й відправляється лише на GitHub.</div>
    <button id="enter">Увійти</button>
    <div id="lerr" class="err" style="margin-top:10px"></div>
  </div>

  <!-- робоча частина -->
  <div id="app" class="hidden">
    <h2>Додати мод</h2>
    <form class="panel" id="f" autocomplete="off">
      <label>ZIP мода</label>
      <input type="file" id="zip" accept=".zip,application/zip">
      <div class="hint">Назва файлу латиницею, без пробілів. Файл піде в GitHub Releases.</div>
      <label>…або посилання на ZIP, який уже лежить десь (замість файлу)</label>
      <input id="zipurl" type="url" placeholder="https://…/мод.zip">
      <div class="row">
        <div><label>Назва</label><input id="title" maxlength="80" required></div>
        <div><label>Автор</label><input id="author" maxlength="60"></div>
      </div>
      <div class="row">
        <div><label>Версія</label><input id="version" value="1.0.0.0" maxlength="20"></div>
        <div><label>Категорія</label><select id="category" required></select></div>
      </div>
      <div class="row" id="sizeRow" style="display:none">
        <div><label>Розмір файлу, МБ (для посилання)</label><input id="sizeMb" type="number" min="0" step="0.1"></div>
        <div></div>
      </div>
      <label>Опис</label>
      <textarea id="description" maxlength="1500"></textarea>
      <div class="row">
        <div><label>Іконка (обкладинка)</label><input type="file" id="image" accept="image/*"></div>
        <div><label>Скріншоти (до 4)</label><input type="file" id="shots" accept="image/*" multiple></div>
      </div>
      <button id="go" type="submit">Опублікувати</button>
      <progress id="pr" max="100" value="0"></progress>
      <div id="log"></div>
    </form>

    <h2>Моди в каталозі</h2>
    <div class="panel" id="list"></div>
    <div class="hint" style="margin-top:10px">Після змін сайт GitHub Pages оновлюється приблизно за 1–2 хвилини.</div>
  </div>
</div>

<script src="config.js"></script>
<script src="shared.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + " МБ" : Math.max(1, Math.round((b || 0) / 1024)) + " КБ";
const CFG = window.FS_CONFIG;
const RP = `/repos/${CFG.OWNER}/${CFG.REPO}`;
const encPath = (p) => p.split("/").map(encodeURIComponent).join("/");
$("cat-url").textContent = FS.siteUrl(CFG) + "/catalog.data";

// ---------- токен ----------
let token = "";
const store = {
  get(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v, persist) { try { (persist ? localStorage : sessionStorage).setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch {} },
};

// ---------- GitHub API ----------
async function errText(r) {
  let msg = "";
  try { msg = (await r.json()).message || ""; } catch {}
  if (r.status === 401) return "Токен недійсний або прострочений";
  if (r.status === 403) return "Немає прав (перевірте дозвіл Contents: Read and write) або ліміт запитів. " + msg;
  if (r.status === 404) return "Не знайдено (перевірте OWNER і REPO в config.js та доступ токена). " + msg;
  return `Помилка GitHub ${r.status}. ${msg}`;
}
function gh(path, opts = {}) {
  return fetch(CFG.API_BASE + path, {
    ...opts,
    headers: { Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", Authorization: "Bearer " + token, ...(opts.headers || {}) },
  });
}
async function ghOk(path, opts) { const r = await gh(path, opts); if (!r.ok) throw Object.assign(new Error(await errText(r)), { status: r.status }); return r; }

const bytesToB64 = (bytes) => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const textToB64 = (t) => bytesToB64(new TextEncoder().encode(t));
const b64ToText = (b) => { const s = atob(b.replace(/\s/g, "")); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return new TextDecoder().decode(a); };

async function getFile(path) {
  const r = await gh(`${RP}/contents/${encPath(path)}?ref=${encodeURIComponent(CFG.BRANCH)}`);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(await errText(r));
  const j = await r.json();
  return { sha: j.sha, text: j.content ? b64ToText(j.content) : "" };
}
async function putFile(path, b64, sha, message) {
  const body = { message, content: b64, branch: CFG.BRANCH }; if (sha) body.sha = sha;
  await ghOk(`${RP}/contents/${encPath(path)}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
}
async function deleteFile(path, message) {
  const f = await getFile(path); if (!f) return;
  await ghOk(`${RP}/contents/${encPath(path)}`, { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message, sha: f.sha, branch: CFG.BRANCH }) });
}

// Змінює mods.json і одразу перегенерує catalog.data. Повторює спробу при конфлікті версій.
async function updateDb(mutator, message) {
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      const f = await getFile("mods.json");
      const db = f && f.text ? JSON.parse(f.text) : { mods: [] };
      db.mods = db.mods || [];
      await mutator(db);
      await putFile("mods.json", textToB64(JSON.stringify(db, null, 2) + "\n"), f && f.sha, message);
      const c = await getFile("catalog.data");
      await putFile("catalog.data", textToB64(FS.buildCatalog(db.mods, CFG)), c && c.sha, message);
      return db;
    } catch (e) {
      if ((e.status === 409 || e.status === 422) && attempt < 3) { await new Promise((r) => setTimeout(r, 600 * (attempt + 1))); continue; }
      throw e;
    }
  }
}

async function ensureRelease() {
  let r = await gh(`${RP}/releases/tags/${encodeURIComponent(CFG.RELEASE_TAG)}`);
  if (r.status === 404) {
    r = await gh(`${RP}/releases`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tag_name: CFG.RELEASE_TAG, name: "Моди", body: "ZIP-файли модів FS23 ModHub", target_commitish: CFG.BRANCH }) });
  }
  if (!r.ok) throw new Error(await errText(r));
  return r.json();
}
function uploadAsset(release, file, name, onProgress) {
  return new Promise((resolve, reject) => {
    const url = release.upload_url.replace(/\{.*$/, "") + "?name=" + encodeURIComponent(name);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", url);
    xhr.setRequestHeader("Authorization", "Bearer " + token);
    xhr.setRequestHeader("Accept", "application/vnd.github+json");
    xhr.setRequestHeader("Content-Type", "application/zip");
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total * 100); };
    xhr.onload = () => {
      let j = {}; try { j = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status >= 200 && xhr.status < 300) return resolve(j);
      if (xhr.status === 422) return reject(new Error("Файл із такою назвою вже є в релізі. Видаліть старий мод або змініть назву файлу."));
      reject(new Error(`Не вдалося завантажити ZIP (${xhr.status}). ${j.message || ""}`));
    };
    xhr.onerror = () => reject(new Error("Браузер не зміг відправити файл на GitHub (мережа або обмеження CORS). Завантажте ZIP вручну на GitHub у Releases і вставте посилання на нього в поле «або посилання на ZIP»."));
    xhr.send(file);
  });
}

// ---------- зображення ----------
async function prepImage(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * k)), h = Math.max(1, Math.round(bmp.height * k));
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise((res) => cv.toBlob(res, "image/jpeg", 0.85));
    if (blob) return new Uint8Array(await blob.arrayBuffer());
  } catch {}
  return new Uint8Array(await file.arrayBuffer());
}
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30) || "mod";
const rand = () => Math.random().toString(16).slice(2, 8);
const safeZipName = (n) => ((String(n).split(/[\\/]/).pop().replace(/\.zip$/i, "").replace(/[^A-Za-z0-9_.-]+/g, "_").replace(/^[_.]+|[_.]+$/g, "")) || "mod") + ".zip";

// ---------- інтерфейс ----------
const logLine = (t, cls) => { $("log").className = cls || ""; $("log").textContent = t; };

async function loadList() {
  try {
    const f = await getFile("mods.json");
    const mods = (f && f.text ? JSON.parse(f.text).mods : []) || [];
    $("list").innerHTML = mods.length ? mods.map((m, i) => `
      <div class="item">
        <div><div>${esc(m.title)} <span class="m">v${esc(m.version)}</span></div>
        <div class="m">${esc(m.category)} · ${esc(m.filename)} · ${fmt(m.size)}</div></div>
        <button class="del" data-fn="${esc(m.filename)}" data-t="${esc(m.title)}">Видалити</button>
      </div>`).join("") : '<div class="m">Поки порожньо</div>';
  } catch (e) { $("list").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

$("list").addEventListener("click", async (e) => {
  const b = e.target.closest("button.del"); if (!b) return;
  const fn = b.dataset.fn;
  if (!confirm(`Видалити «${b.dataset.t}»? Файли теж буде стерто.`)) return;
  b.disabled = true;
  try {
    let removed = null;
    await updateDb((db) => { const i = db.mods.findIndex((m) => m.filename === fn); if (i >= 0) [removed] = db.mods.splice(i, 1); }, `Видалено мод ${fn}`);
    if (removed) {
      // файли чистимо найкращим зусиллям: помилка тут не страшна
      try {
        const rel = await (await ghOk(`${RP}/releases/tags/${encodeURIComponent(CFG.RELEASE_TAG)}`)).json();
        const a = (rel.assets || []).find((x) => x.name === fn);
        if (a) await ghOk(`${RP}/releases/assets/${a.id}`, { method: "DELETE" });
      } catch {}
      for (const p of [removed.image, ...(removed.screenshots || [])].filter(Boolean)) { try { await deleteFile(p, "Видалено зображення"); } catch {} }
    }
  } catch (err) { alert(err.message); }
  loadList();
});

$("zipurl").addEventListener("input", () => { $("sizeRow").style.display = $("zipurl").value.trim() ? "" : "none"; });

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const zip = $("zip").files[0], url = $("zipurl").value.trim();
  const title = $("title").value.trim();
  if (!zip && !url) return logLine("Виберіть ZIP-файл або вставте посилання на нього", "err");
  if (url && !/^https:\/\/.+/i.test(url)) return logLine("Посилання має починатися з https://", "err");
  if (zip && !/\.zip$/i.test(zip.name)) return logLine("Потрібен файл .zip", "err");
  if (!title) return logLine("Вкажіть назву", "err");

  const image = $("image").files[0], shots = [...$("shots").files].slice(0, 4);
  const go = $("go"), pr = $("pr");
  go.disabled = true; pr.style.display = "block"; pr.value = 0;
  const written = []; // зображення, записані в репозиторій (для відкату)
  try {
    let filename, size, sha256 = "", downloadUrl;
    if (zip) {
      filename = safeZipName(zip.name);
      const cur = await getFile("mods.json");
      if (cur && cur.text && JSON.parse(cur.text).mods.some((m) => m.filename === filename)) throw new Error(`Мод із файлом ${filename} уже є. Видаліть старий або змініть назву файлу.`);
      logLine("1/4 Рахую контрольну суму…"); sha256 = await FS.sha256File(zip, (p) => { pr.value = p * 0.2; });
      logLine("2/4 Готую реліз…"); const rel = await ensureRelease();
      logLine("3/4 Завантажую ZIP… 0%");
      const asset = await uploadAsset(rel, zip, filename, (p) => { pr.value = 20 + p * 0.6; logLine(`3/4 Завантажую ZIP… ${Math.round(p)}%`); });
      filename = asset.name || filename; size = asset.size || zip.size; downloadUrl = asset.browser_download_url;
    } else {
      filename = safeZipName(new URL(url).pathname);
      size = Math.round(Number($("sizeMb").value || 0) * 1048576); downloadUrl = url;
    }

    logLine("4/4 Зберігаю картинки й каталог…"); pr.value = 85;
    const saveImg = async (f) => { const bytes = await prepImage(f); const p = `images/${slug(title)}-${rand()}.jpg`; await putFile(p, bytesToB64(bytes), null, `Зображення для ${title}`); written.push(p); return p; };
    const imgPath = image ? await saveImg(image) : null;
    const shotPaths = []; for (const s of shots) shotPaths.push(await saveImg(s));

    const mod = {
      title, author: $("author").value.trim(), version: $("version").value.trim() || "1.0.0.0", category: $("category").value,
      description: $("description").value.trim(), filename, size, sha256, downloadUrl, image: imgPath, screenshots: shotPaths,
      createdAt: new Date().toISOString(),
    };
    await updateDb((db) => {
      if (db.mods.some((m) => m.filename === filename)) throw new Error(`Мод із файлом ${filename} уже є.`);
      db.mods.push(mod);
    }, `Додано мод ${title}`);
    pr.value = 100;
    logLine("Готово: мод додано в каталог. Сайт оновиться за 1–2 хвилини.", "ok");
    $("f").reset(); $("version").value = "1.0.0.0"; $("sizeRow").style.display = "none";
    loadList();
  } catch (err) {
    for (const p of written) { try { await deleteFile(p, "Відкат зображення"); } catch {} }
    logLine(err.message, "err");
  } finally { go.disabled = false; pr.style.display = "none"; }
});

async function enter() {
  $("lerr").textContent = "";
  token = $("tok").value.trim() || store.get("fs23_gh_token");
  if (!token) return;
  if (/^ваш-/.test(CFG.OWNER)) { $("lerr").textContent = "Спершу вкажіть свій логін GitHub в config.js (поле OWNER)."; return; }
  $("enter").disabled = true;
  try {
    const r = await gh(RP);
    if (!r.ok) throw new Error(await errText(r));
    const repo = await r.json();
    if (repo.permissions && !repo.permissions.push) throw new Error("У токена немає права запису в цей репозиторій");
    store.del("fs23_gh_token"); store.set("fs23_gh_token", token, $("remember").checked);
    $("login").classList.add("hidden"); $("app").classList.remove("hidden"); $("logout").classList.remove("hidden");
    $("tok").value = "";
    loadList();
  } catch (e) { token = ""; $("lerr").textContent = e.message; }
  $("enter").disabled = false;
}
$("enter").addEventListener("click", enter);
$("tok").addEventListener("keydown", (e) => { if (e.key === "Enter") enter(); });
$("logout").addEventListener("click", () => { store.del("fs23_gh_token"); location.reload(); });
$("category").innerHTML = FS.CATEGORIES.map((c) => `<option value="${c.name}">${esc(c.title)} (${c.name})</option>`).join("");
if (store.get("fs23_gh_token")) enter();
</script>
</body>
</html>
